<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191e">
  <title>Neptune — Library</title>
  <link rel="stylesheet" href="neptune-ui.css">
  <link rel="stylesheet" href="library.css">
  <script src="library.js" defer></script>
</head>
<body data-theme="portfolio-spectrum">
  <section id="previewRoot" aria-label="Neptune Library final design">
    <div class="t3-screen theme-portfolio-spectrum">
      <aside class="t3-sidebar library-sidebar" id="librarySidebar" aria-label="Chat history">
        <div class="library-panel">
          <header class="library-header">
            <div class="library-brandline">
              <span class="library-brand">Neptune</span>
              <button class="library-icon-button" type="button" data-new-chat aria-label="New chat">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
            <label class="library-search">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>
              <input id="historySearch" type="search" aria-label="Search library" placeholder="Search library">
            </label>
            <div class="library-tabs" role="tablist" aria-label="History scope">
              <button class="library-tab is-active" type="button" data-scope="all" aria-selected="true">All</button>
              <button class="library-tab" type="button" data-scope="saved" aria-selected="false">Saved</button>
            </div>
          </header>
          <div class="library-scroll" id="libraryHistory">
            <section class="library-group" data-history-group>
              <h2 class="library-label">Pinned <span>04</span></h2>
              <button class="library-thread is-active" type="button" data-thread-id="dark-spot" data-pinned="true" data-search="neptune’s great dark spot atmosphere storms" aria-pressed="true">
                <span class="library-star" style="--star:#a5f3de" aria-hidden="true">✦</span><span class="library-thread-title">Neptune’s Great Dark Spot</span>
              </button>
              <button class="library-thread" type="button" data-thread-id="rings" data-pinned="true" data-search="the faint rings of neptune planet" aria-pressed="false">
                <span class="library-star" style="--star:#c6b8ff" aria-hidden="true">✦</span><span class="library-thread-title">The faint rings of Neptune</span>
              </button>
              <button class="library-thread" type="button" data-thread-id="mission" data-pinned="true" data-search="a future neptune mission spacecraft probe" aria-pressed="false">
                <span class="library-star" style="--star:#f2d67c" aria-hidden="true">✦</span><span class="library-thread-title">A future Neptune mission</span>
              </button>
              <button class="library-thread" type="button" data-thread-id="voyager" data-pinned="true" data-search="voyager 2 flyby notes mission" aria-pressed="false">
                <span class="library-star" style="--star:#ff9e83" aria-hidden="true">✦</span><span class="library-thread-title">Voyager 2 flyby notes</span>
              </button>
            </section>
            <section class="library-group library-recent" data-history-group>
              <h2 class="library-label">Recent</h2>
              <button class="library-thread" type="button" data-thread-id="triton" data-pinned="false" data-search="life beneath triton’s ice moons ocean" aria-pressed="false"><span class="library-thread-title">Life beneath Triton’s ice</span></button>
              <button class="library-thread" type="button" data-thread-id="blue-color" data-pinned="false" data-search="why neptune looks blue atmosphere" aria-pressed="false"><span class="library-thread-title">Why Neptune looks blue</span></button>
              <button class="library-thread" type="button" data-thread-id="orbital" data-pinned="false" data-search="neptune’s orbital mechanics science" aria-pressed="false"><span class="library-thread-title">Neptune’s orbital mechanics</span></button>
              <button class="library-disclosure" type="button" data-toggle-older aria-expanded="false">Earlier conversations <span>02</span><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button>
              <div class="library-older" id="olderThreads" hidden>
                <button class="library-thread" type="button" data-thread-id="moon-ocean" data-pinned="false" data-search="could a moon hide an ocean moons" aria-pressed="false"><span class="library-thread-title">Could a moon hide an ocean?</span></button>
                <button class="library-thread" type="button" data-thread-id="ice-giants" data-pinned="false" data-search="comparing the ice giants science uranus" aria-pressed="false"><span class="library-thread-title">Comparing the ice giants</span></button>
              </div>
            </section>
          </div>
          <footer class="library-footer"><span class="library-avatar">T</span><span class="library-account">Personal space</span><button class="library-more" type="button" aria-label="More account options">···</button></footer>
        </div>
      </aside>
      <button class="library-backdrop" type="button" data-close-history aria-label="Close chat history" hidden></button>
      <main class="t3-main" id="chat">
        <div class="t3-toolbar">
          <div class="toolbar-left">
            <button type="button" class="icon-button library-history-toggle" data-toggle-history aria-label="Open chat history" aria-controls="librarySidebar" aria-expanded="false">
              <svg class="ui-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
            </button>
          </div>
          <div class="toolbar-right"><button type="button" class="icon-button" aria-label="Recent activity"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></svg></button></div>
        </div>
        <div class="t3-content">
          <h1>How can I help you?</h1>
          <div class="mode-pills" aria-label="Prompt category"><button type="button" class="selected"><span>✳</span> Create</button><button type="button"><span>▤</span> Explore</button><button type="button"><span>‹›</span> Code</button><button type="button"><span>◇</span> Learn</button></div>
          <div class="suggestion-list"><button type="button">How do Neptune’s atmospheric bands form?<span>↗</span></button><button type="button">What are Neptune’s rings made from?</button><button type="button">Could a moon hide an ocean beneath its ice?</button><button type="button">What should a future Neptune mission investigate?</button></div>
          <div id="conversationLog" class="conversation-log" aria-live="polite"></div>
        </div>
        <form class="t3-composer" id="demoComposer"><label class="sr-only" for="messageInput">Message Neptune</label><textarea id="messageInput" rows="1" placeholder="Type your message here..."></textarea><div class="composer-toolbar"><div class="composer-left"><button type="button" class="composer-model">Neptune Core <span class="model-cost">$$</span><span>⌄</span></button><button type="button" class="composer-tool"><span>ϟ</span> Instant</button><button type="button" class="composer-tool"><span>◎</span> Search</button><button type="button" class="composer-tool"><span>↗</span> Attach</button></div><span class="composer-hint">Enter to send · Shift + Enter for new line</span><button type="submit" class="composer-send" aria-label="Send message"><svg class="ui-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div></form>
      </main>
    </div>
  </section>
</body>
</html>
