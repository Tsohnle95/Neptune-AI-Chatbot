<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neptune AI | A Friendly, Locally Hosted Chatbot</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.scss">
    <script src="js/main.js" defer></script>
</head>

<body>
    <!--landing page content-->
    

    <!--chatbot content-->
    <div class="chatbot-content">

        <div class="header-dashboard-flex-container">
            <!--TOGGLE NAV MENU-->
            
            <!--end of hamburger menu-->




            <div class="header-chat-area-wrapper">
                <header>
                    <div class="header-container">

                        <div class="flex">

                            <!--hamburger menu dropdown-->
                            <div class="header-svg1">
                                <button class="toggle-btn">
                                    <img src="img/svg/hamburger.svg" alt="Main Menu">
                                </button>



                                <!--left arrow return button -->
                                <img src="img/svg/arrow-left.svg" alt="Click to Close Menu" class="left-arrow">
                            </div>

                            <div class="chatbot-header-text">
                                <!-- <img src="img/svg/arrow-left.svg" alt="Click to Close Menu" class="desktop-arrow"> -->
                                <div>
                                    <h2>Neptune AI</h2>
                                    <p class="server-status"></p>
                                </div>
                            </div>
                        </div> <!--end of flex-->

                        <button>
                            <img src="img/svg/elipses.svg" alt="Secondary Menu" class="svg-2">
                        </button>

                    </div><!--end of header container-->
                </header>





                <!--chat area content-->
                <div class="chat-area">

                    <!-- chat content div with the 4 recommended ai prompts -->
                    <div class="chat-content-div">

                        <div class="hi-neptune">
                            <img src="img/svg/neptune-icon.svg" alt="Neptune AI icon">
                            <p>Hi, I'm Neptune</p>
                            <p>How can I help you today?</p>

                        </div>


                        <div class="recommendation-flex-main-container">
                            <div class="recommendation-flex-container">

                                <!-- chat recommendation divs  -->
                                <div class="ai-chat-recommendation submit-prompt">
                                    <div>
                                        <div>
                                            <img src="img/lightbulb.png" alt="lightbulb icon">
                                            <p>Explain a concept</p>
                                        </div>
                                        <p class="recommendation-content">How does async/await work?</p>
                                    </div>
                                </div>

                                <!-- chat recommendation divs  -->
                                <div class="ai-chat-recommendation submit-prompt">
                                    <div>
                                        <div>
                                            <img src="img/wrench.png" alt="wrench icon">
                                            <p>Debug code</p>
                                        </div>
                                        <p class="recommendation-content">Help fix my react component</p>
                                    </div>
                                </div>
                            </div>



                            <div class="recommendation-flex-container">

                                <!-- chat recommendation divs  -->
                                <div class="ai-chat-recommendation submit-prompt">
                                    <div>
                                        <div>
                                            <img src="img/star.png" alt="star icon">
                                            <p>Generate code</p>
                                        </div>
                                        <p class="recommendation-content">Write a sorting function</p>
                                    </div>
                                </div>

                                <!-- chat recommendation divs  -->
                                <div class="ai-chat-recommendation submit-prompt">
                                    <div>
                                        <div>
                                            <img src="img/books.png" alt="books icon">
                                            <p>Best practices</p>
                                        </div>
                                        <p class="recommendation-content">Teach me REST API design</p>
                                    </div>
                                </div>

                            </div>
                        </div><!--end of ai chat recommmendation-->
                    </div>

                    <!--dialogue box-->
                    <div class="dialogue-box hidden">

                        <div class="scroll-container">

                            <!-- <div class="ai-chat-div">
                                <div>
                                    <img src="img/svg/neptune-icon.svg" alt="Neptune ai icon">
                                </div>
                                <div>
                                    <p class="chat-content">
                                    </p>
                                    <p class="chat-time">
                                        04:58 PM
                                    </p>
                                </div>
                            </div> -->

                            <!--delete user chat div after i get the js working-->
                            <!-- <div class="user-chat-div">
                                <div>
                                    <img src="img/user-icon.png" alt="Neptune ai icon">
                                </div>
                                <div>
                                    <p class="chat-content">

                                    </p>
                                    <p class="chat-time">
                                        04:59 PM
                                    </p>
                                </div>

                            </div> -->


                        </div>

                    </div>

                    <!--chat input -->
                    <footer>
                        <form>
                            <div class="input-container">
                                <input type="text" id="chat-input" name="chat-input" placeholder="Type your message...">

                                <button type="submit" id="submit"><img src="img/svg/rocket.svg" alt="send button icon">
                                    <div class="abort-button hidden">

                                    </div>
                                </button>

                            </div>
                        </form>

                    </footer>
                </div>


                <!-- click here to return to the landing page. -->
            </div> <!--end of chatbot content-->
        </div>
    </div>

</body>

</html>
