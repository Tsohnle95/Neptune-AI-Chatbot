<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neptune AI | A Friendly, Locally Hosted Chatbot</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>
</head>

<body>
    <div class="pointer">
        <svg class="side-menu-button" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M9 4v16" />
        </svg>
    </div>


    <!--chatbot html-->
    <div class="container">

        <!--hidden side panel-->
        <div class="side-menu">
            <!--side panel icon/button -->


            <!--side panel-->
            <div class="side-panel inner-container">
                <div class="flex">
                    <p>Neptune</p>
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"
                        stroke-linecap="round" aria-hidden="true">
                        <path d="M12 5v14M5 12h14" class="add-new"></path>
                    </svg>
                </div>

                <!--form search input -->
                <form action="POST">
                    <div>
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                            stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
                            <circle cx="10.5" cy="10.5" r="6.5"></circle>
                            <path d="m15.5 15.5 4.5 4.5"></path>
                        </svg>
                        <input type="text" name="search" id="search" placeholder="Search library">
                    </div>
                </form>
                <!--all | saved tabs-->
                <div class="all-saved-tabs">
                    <span>All</span>
                    <span>Saved</span>
                </div>

                <!--pinned messages-->
                <div class="pinned-messages">
                    <div>
                        <h2 class="pinned">PINNED</h2>
                        <span class="pinned-count">04</span>
                    </div>

                    <button class="pinned-message">
                    <span class="library-star">✦</span> <span>Neptune's Great Dark Spot</span>
                    </button>
                    <button class="pinned-message">
                    <span class="library-star">✦</span> <span>Neptune's Great Dark Spot</span>
                    </button>
                    <button class="pinned-message">
                    <span class="library-star">✦</span> <span>Neptune's Great Dark Spot</span>
                    </button>
                    <button class="pinned-message">
                    <span class="library-star">✦</span> <span>Neptune's Great Dark Spot</span>
                </button>
                </div>

                <!--recent messages-->
                <div class="recent-messages">
                    <h2>RECENT</h2>
                    <button>
                <span>Life Beneath Triton's ice</span>
                </button>
                    <button>
                <span>Why Neptune looks blue</span>
                </button>
                    <button>
                <span>Neptune's orbital mechanics</span>
                </button>
                </div>

                <!--earlier converstaions area-->
                <div class="earlier-conversations">
                    <div class="accordion">
                        <span>Earlier conversations</span>
                        <div>
                            <span>02</span>
                            <svg class="rotate dropdown-arrow" viewBox="0 0 24 24" width="13" height="13" fill="none"
                                stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
                                <path d="m8 10 4 4 4-4"></path>
                            </svg>
                        </div>
                    </div>
                </div>
                <!--earlier conversations dropdown-->
                <div class="earlier-convo-dropdown d-none">
                    <button>Could a moon hide an ocean?</button>
                    <button>Comparing the ice giants</button>
                </div>

                <div class="spring">
                    <div>
                        <span>T</span>
                        <p>Personal space</p>
                    </div>
                    <button>
                    ...
                </button>
                </div>

            </div>

        </div> <!--end of side-panel-->


        <section class="inner-container">
            <div class="contents">
                <div class="contents-container">
                    <h1>How can i help you?</h1>
                    <div class="recommended-prompt-categories">
                        <button type="button"><span>✳</span>Create</button>
                        <button type="button"><span>▤</span>Explore</button>
                        <button><span>&lsaquo;&rsaquo;</span> Code</button>
                        <button type="button"><span>◇</span>Learn</button>
                    </div>

                    <div class="recommended-prompts">
                        <div>
                            <p>How do Neptune’s atmospheric bands form?</p>
                        </div>
                        <div>
                            <p>What are Neptune’s rings made from?</p>
                        </div>
                        <div>
                            <p>Could a moon hide an ocean beneath its ice?</p>
                        </div>
                        <div>
                            <p>What should a future Neptune mission investigate?</p>
                        </div>
                    </div>
                </div>
                <div class="chatbot-input">
                    <form action="post">
                        <textarea
                name="chat-input"
                id="chat-input"
                placeholder="Type your message here..."></textarea>
                    </form>

                    <div class="input-row">
                        <button class="send-prompt"><svg class="ui-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
                    </div>

                </div>
            </div>
        </section>


    </div>


</body>

</html>
